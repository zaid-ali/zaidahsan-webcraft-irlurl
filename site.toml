[site.prd]
file = "PRD.md"
setup = "npm install && npm run build && npm start — server at http://127.0.0.1:5173, healthz /healthz; check with npm run check"
backend = "Dependency-free Node static server server.js serves public/ with ETag, conditional requests, byte ranges, immutable caching for assets, no-cache for index.html/sw.js/json, health reporting at /healthz returning build version. Content from local src/data.json (team 4 + pages 6) rendered into readable HTML/CSS/JS modules, WebGL scene via local GLB + HDR + map textures, no external DB, no analytics, no production origin fetches at runtime, 404 for unknown files."

